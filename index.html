<!DOCTYPE html>
<html>
<head>
<title>Digital Clock</title>
<style>
body{
    background:black;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:Arial;
}
#clock{
    color:lime;
    font-size:70px;
    border:5px solid white;
    padding:30px;
    border-radius:20px;
    background:#111;
}
</style>
</head>
<body>
<div id="clock"></div>
<script>
function updateClock(){
    let now = new Date();
    let time = now.toLocaleTimeString();
    document.getElementById("clock").innerHTML = time;
}
setInterval(updateClock,1000);
updateClock();
</script>
</body>
</html>
